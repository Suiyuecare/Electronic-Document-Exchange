name: Deploy eDoc to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Static checks
        run: |
          python -m py_compile backend.py api/index.py
          node --check app.js

      - name: Install Vercel CLI
        run: npm install -g vercel@46

      - name: Pull Vercel production environment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build production artifact
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production artifact
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          DEPLOY_URL="$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} | tail -n 1)"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $DEPLOY_URL"

      - name: Smoke test production
        env:
          EDOC_PRODUCTION_URL: ${{ secrets.EDOC_PRODUCTION_URL }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          BASE_URL="${EDOC_PRODUCTION_URL:-https://edoc.suiyuecare.com}"
          BASE_URL="${BASE_URL%/}"
          curl --fail --silent --show-error "$BASE_URL/api/healthz"
          curl --fail --silent --show-error "$BASE_URL/api/production/deployment"
          curl --fail --silent --show-error "$BASE_URL/api/production/monitoring"
