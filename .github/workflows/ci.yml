name: eDoc CI

on:
  pull_request:
  push:
    branches:
      - main

# A quick follow-up commit supersedes the older validation on the same PR or
# branch. Cancel it instead of letting stale failures finish and email again.
concurrency:
  group: edoc-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supabase-fresh-bootstrap:
    name: Rebuild Supabase from migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned Supabase CLI
        # setup-cli v3 installs the pinned CLI through npm and runs on the
        # current Actions runtime. Pin the reviewed v3.0.0 commit so upstream
        # tag movement cannot silently change this production gate.
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          # 2.116.0 fixes stale local DB connections, loopback proxy routing,
          # Kong DNS caching and service-start reliability. Keep this pinned so
          # the isolated PostgREST/TUS gate is reproducible.
          version: 2.116.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Set up Python for isolated Storage acceptance
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned application dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Reset fresh local database and exercise RPC contracts
        run: |
          set -euo pipefail
          # Real signed TUS needs Kong + Storage, not only the Postgres service.
          # Suppress the normal local credential summary; tests consume the
          # ephemeral values through command substitution below, never logs.
          supabase start >/dev/null
          trap 'supabase stop --no-backup' EXIT
          supabase db reset --local

          for migration in supabase/storage-migrations/*.sql; do
            PGPASSWORD=postgres psql \
              --host 127.0.0.1 \
              --port 54322 \
              --username postgres \
              --dbname postgres \
              --set ON_ERROR_STOP=1 \
              --file "$migration"
          done

          PGPASSWORD=postgres psql \
            --host 127.0.0.1 \
            --port 54322 \
            --username postgres \
            --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --file supabase/verification/local_storage_tus_gate.sql

          PGPASSWORD=postgres psql \
            --host 127.0.0.1 \
            --port 54322 \
            --username postgres \
            --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --file supabase/verification/fresh_bootstrap_smoke.sql
          PGPASSWORD=postgres psql \
            --host 127.0.0.1 \
            --port 54322 \
            --username postgres \
            --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --file supabase/verification/runtime_schema_parity_smoke.sql
          PGPASSWORD=postgres psql \
            --host 127.0.0.1 \
            --port 54322 \
            --username postgres \
            --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --file supabase/verification/service_role_data_api_grant_smoke.sql

          pids=()
          for index in $(seq -w 1 20); do
            PGPASSWORD=postgres psql \
              --host 127.0.0.1 \
              --port 54322 \
              --username postgres \
              --dbname postgres \
              --set ON_ERROR_STOP=1 \
              --command "insert into public.audit_logs (id, actor, action, target_type, target_id, detail, created_at) values ('AUD-CI-CONCURRENT-${index}', 'ci', 'concurrent chain smoke', 'verification', 'fresh-bootstrap', 'deidentified smoke row', '2099-01-01 00:00:00');" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid"
          done

          PGPASSWORD=postgres psql \
            --host 127.0.0.1 \
            --port 54322 \
            --username postgres \
            --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --file supabase/verification/audit_chain_concurrency_check.sql

          eval "$(supabase status -o env)"
          test -n "${API_URL:-}"
          test -n "${ANON_KEY:-}"
          test -n "${SERVICE_ROLE_KEY:-}"
          EDOC_LOCAL_SUPABASE_URL="$API_URL" \
          EDOC_LOCAL_SUPABASE_ANON_KEY="$ANON_KEY" \
          EDOC_LOCAL_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            python tests/support/local_supabase_editor_finalize_rpc_gate.py

          EDOC_ACCEPTANCE_UPLOAD_PROTOCOL=local_supabase_tus \
          EDOC_LOCAL_SUPABASE_URL="$API_URL" \
          EDOC_LOCAL_SUPABASE_ANON_KEY="$ANON_KEY" \
          EDOC_LOCAL_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            python -m unittest -v tests.test_five_account_http_acceptance

          PGPASSWORD=postgres psql \
            --host 127.0.0.1 \
            --port 54322 \
            --username postgres \
            --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --file supabase/verification/local_storage_tus_gate.sql
          supabase db lint --local --schema public --level error --fail-on error

      - name: Preserve isolated TUS acceptance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: local-supabase-tus-five-account-${{ github.run_id }}
          path: tests/.artifacts/five-account-acceptance/
          if-no-files-found: warn
          retention-days: 14

  validate:
    name: Validate backend and frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pglast==7.14

      - name: Compile Python backend
        run: python -m py_compile backend.py api/index.py

      - name: Check frontend JavaScript
        run: node --check app.js

      - name: Replay five-account acceptance with alternate seed
        env:
          EDOC_ACCEPTANCE_SEED: "90210"
        run: python -m unittest -v tests.test_five_account_http_acceptance

      - name: Run backend and frontend contract tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Preserve deidentified five-account acceptance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: five-account-acceptance-${{ github.run_id }}
          path: tests/.artifacts/five-account-acceptance/
          if-no-files-found: warn
          retention-days: 14

      - name: Initialize SQLite schema
        run: python backend.py --init-only

      - name: Smoke test API
        run: |
          set -euo pipefail
          python backend.py --host 127.0.0.1 --port 5174 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:5174/api/health >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:5174/api/production/readiness >/dev/null

          assert_unauthorized() {
            local path="$1"
            local status
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "http://127.0.0.1:5174${path}")"
            test "$status" = "401"
          }

          assert_unauthorized /api/cron/run-due
          assert_unauthorized /api/dashboard
          assert_unauthorized /api/documents
